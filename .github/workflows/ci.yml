name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test (fakes only, never touches real power settings)
        run: ./scripts/test.sh
      - name: Build app bundle
        run: ./scripts/build-app.sh
